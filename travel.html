<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Travel Globe</title>
<style>
  :root{
    --bg:#05070d; --panel:rgba(12,18,30,0.55); --border:rgba(120,170,255,0.18);
    --txt:#e8eefc; --muted:#8da2c9; --accent:#5ad1ff; --accent2:#ffc24d;
  }
  *{box-sizing:border-box;-webkit-font-smoothing:antialiased}
  html,body{margin:0;height:100%;background:var(--bg);overflow:hidden;
    font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:var(--txt)}
  #globeViz{position:absolute;inset:0}
  #globeViz canvas{outline:none}
  .overlay{position:absolute;inset:0;pointer-events:none}
  .hud{pointer-events:auto}
  .hdr{position:absolute;top:22px;left:24px;max-width:360px}
  .hdr a.back{display:inline-block;font-size:11.5px;font-weight:600;letter-spacing:.04em;color:var(--muted);
    text-decoration:none;margin-bottom:8px;transition:color .15s}
  .hdr a.back:hover{color:var(--accent)}
  .hdr h1{margin:0;font-size:19px;font-weight:600;letter-spacing:.2px}
  .hdr p{margin:6px 0 0;font-size:12.5px;color:var(--muted);line-height:1.5}
  .stats{position:absolute;top:22px;right:24px;display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end;max-width:340px}
  .stat{background:var(--panel);border:1px solid var(--border);backdrop-filter:blur(10px);
    border-radius:12px;padding:9px 13px;min-width:74px;text-align:center}
  .stat .n{font-size:20px;font-weight:700;line-height:1;background:linear-gradient(90deg,var(--accent),var(--accent2));
    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
  .stat .l{font-size:9.5px;letter-spacing:.10em;text-transform:uppercase;color:var(--muted);margin-top:5px}
  .ctrl{position:absolute;left:50%;transform:translateX(-50%);bottom:24px;
    background:var(--panel);border:1px solid var(--border);backdrop-filter:blur(12px);
    border-radius:16px;padding:14px 18px;display:flex;align-items:center;gap:16px;
    width:min(720px,calc(100% - 40px))}
  .info{min-width:170px;max-width:200px}
  .info .route{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .info .route .arrow{color:var(--muted);font-weight:500;margin:0 5px}
  .info .sub{font-size:9.5px;letter-spacing:.10em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-top:4px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .info .from{color:var(--accent)} .info .to{color:var(--accent2)}
  .slider-wrap{flex:1;display:flex;align-items:center}
  input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:4px;border-radius:4px;
    background:linear-gradient(90deg,var(--accent),var(--accent2));outline:none;cursor:pointer}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;
    background:#fff;border:3px solid var(--accent);box-shadow:0 0 10px rgba(90,209,255,.6);cursor:pointer}
  input[type=range]::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:#fff;border:3px solid var(--accent);cursor:pointer}
  .btn{pointer-events:auto;cursor:pointer;border:1px solid var(--border);background:rgba(90,209,255,.10);
    color:var(--txt);border-radius:10px;padding:9px 12px;font-size:12.5px;font-weight:600;
    display:inline-flex;align-items:center;gap:6px;white-space:nowrap;transition:background .15s,border-color .15s}
  .btn:hover{background:rgba(90,209,255,.22);border-color:var(--accent)}
  .btn.active{background:rgba(255,194,77,.18);border-color:var(--accent2)}
  .ttip{font:500 12px/1.4 'Inter',sans-serif;padding:7px 10px;border-radius:9px;
    background:rgba(8,12,22,.92);border:1px solid var(--border);color:var(--txt);white-space:nowrap}
  .ttip b{color:var(--accent)} .ttip .c{color:var(--muted);font-size:11px}
  .hint{position:absolute;bottom:96px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--muted);
    opacity:.7;pointer-events:none;text-align:center;width:100%}
  @media(max-width:640px){
    .hdr{top:14px;left:14px;max-width:60%} .hdr h1{font-size:15px} .hdr p{display:none}
    .stats{top:12px;right:12px;gap:6px;max-width:42%}
    .stat{padding:6px 8px;min-width:0} .stat .n{font-size:14px} .stat .l{font-size:8px}
    .ctrl{bottom:14px;gap:9px;padding:10px 12px}
    .info{min-width:96px;max-width:120px} .info .route{font-size:11px} .info .sub{font-size:8px}
    .btn{padding:7px 8px;font-size:11px} .hint{display:none}
  }
</style>
</head>
<body>
<div id="globeViz"></div>
<div class="overlay">
  <div class="hdr hud">
    <a class="back" href="/">&larr; Ethan Vera</a>
    <h1>Around the World</h1>

    <div class="stat"><div class="n" id="s-countries">0</div><div class="l">Countries</div></div>
  </div>
  <div class="hint">Press play to watch each flight, one at a time</div>
  <div class="ctrl hud">
    <button class="btn play" id="play" title="Play / pause">
      <svg id="play-ico" width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
      <span id="play-lbl">Play</span>
    </button>
    <div class="info"><div class="route" id="route">All routes</div><div class="sub" id="sub">477 flights &middot; 1998&ndash;2025</div></div>
    <div class="slider-wrap"><input type="range" id="slider" step="1"/></div>
    <button class="btn active" id="all" title="Show all routes">All</button>
  </div>
</div>

const ST = DATA.stats, C = DATA.coords, LEGS = DATA.legs, N = LEGS.length;
const STEP_MS = 1300;            // per-flight playback (doubled from prior 650ms)
const BASE_CAP='rgba(255,255,255,0.015)', BASE_STROKE='rgba(120,170,255,0.13)';
// my country label -> list of acceptable lowercased names found in the geojson (ADMIN/NAME)
const COUNTRY_NORM = {
  "USA":["united states of america","united states"],"United States":["united states of america","united states"],
  "California":["united states of america","united states"],
  "Canada":["canada"],"Mexico":["mexico"],"China":["china"],"Hong Kong":["china","hong kong s.a.r."],"Japan":["japan"],
  "Korea":["south korea","republic of korea"],"North Korea":["north korea","dem. rep. korea"],
  "Taiwan":["taiwan"],"Thailand":["thailand"],"Vietnam":["vietnam"],"Singapore":["singapore"],
  "Malaysia":["malaysia"],"Indonesia":["indonesia"],"Myanmar":["myanmar"],"Laos":["laos","lao pdr"],
  "India":["india"],"Australia":["australia"],"Argentina":["argentina"],"Uruguay":["uruguay"],
  "Paraguay":["paraguay"],"Brazil":["brazil"],"Chile":["chile"],"Peru":["peru"],"Colombia":["colombia"],
  "Panama":["panama"],"El Salvador":["el salvador"],"Bahamas":["the bahamas","bahamas"],"Barbados":["barbados"],
  "Dominica":["dominica"],"Dominican Republic":["dominican republic","dominican rep."],"Jamaica":["jamaica"],
  "Ethiopia":["ethiopia"],"Kenya":["kenya"],"UAE":["united arab emirates"],"Isreal":["israel"],
  "France":["france"],"Spain":["spain"],"Italy":["italy"],"Netherlands":["netherlands"],"Portugal":["portugal"],
  "United Kingdom":["united kingdom"],"Czech Republic":["czechia","czech rep.","czech republic"],"Croatia":["croatia"]
};
const STAT_NORM = {USA:'United States',California:'United States','Hong Kong':'China'};

// ---- helpers ----
function city(key){return key.split('|')[0];}
function country(key){return key.split('|')[1];}
function geoName(f){return ((f.properties&&(f.properties.ADMIN||f.properties.NAME||f.properties.name))||'').toLowerCase();}
function haversine(a,b){const R=6371,r=x=>x*Math.PI/180;const dLat=r(b[0]-a[0]),dLng=r(b[1]-a[1]);
  const s=Math.sin(dLat/2)**2+Math.cos(r(a[0]))*Math.cos(r(b[0]))*Math.sin(dLng/2)**2;return 2*R*Math.asin(Math.sqrt(s));}
function arcAlt(a){const d=haversine([a.sLat,a.sLng],[a.eLat,a.eLng]);return Math.min(0.02+d/12000*0.55,0.62);}
function animateCount(el,to,dur=700){const start=performance.now(),from=parseInt(el.textContent)||0;
  (function step(t){const k=Math.min((t-start)/dur,1),e=1-Math.pow(1-k,3);
   el.textContent=Math.round(from+(to-from)*e);if(k<1)requestAnimationFrame(step);})(performance.now());}
function midpoint(aLat,aLng,bLat,bLng){let dLng=bLng-aLng;if(dLng>180)dLng-=360;if(dLng<-180)dLng+=360;
  return {lat:(aLat+bLat)/2,lng:aLng+dLng/2};}

// ---- globe ----
const world = Globe()(document.getElementById('globeViz'))
  .globeImageUrl('https://unpkg.com/three-globe@2.31.0/example/img/earth-night.jpg')
  .bumpImageUrl('https://unpkg.com/three-globe@2.31.0/example/img/earth-topology.png')
  .backgroundImageUrl('https://unpkg.com/three-globe@2.31.0/example/img/night-sky.png')
  .atmosphereColor('#5ad1ff').atmosphereAltitude(0.18)
  .arcStartLat(d=>d.sLat).arcStartLng(d=>d.sLng).arcEndLat(d=>d.eLat).arcEndLng(d=>d.eLng)
  .arcColor(()=>['rgba(90,209,255,0.9)','rgba(255,194,77,0.9)'])
  .arcAltitude(arcAlt)
  .arcStroke(d=>Math.min(0.18+(d.count-1)*0.07,0.7))
  .arcDashLength(0.5).arcDashGap(0.16).arcDashInitialGap(()=>Math.random()).arcDashAnimateTime(2200)
  .arcLabel(d=>`<div class="ttip"><b>${d.from}</b> &rarr; <b>${d.to}</b><div class="c">${d.count} trip${d.count>1?'s':''} &middot; ${d.minY}${d.maxY!==d.minY?'–'+d.maxY:''}</div></div>`)
  .pointLat('lat').pointLng('lng').pointAltitude(0.012)
  .pointRadius(d=>Math.min(0.16+Math.sqrt(d.count)*0.10,0.95))
  .pointColor(d=>d.role==='from'?'#5ad1ff':(d.role==='to'?'#ffc24d':'#ffd98a'))
  .pointLabel(d=>`<div class="ttip"><b>${d.name}</b><div class="c">${d.country} &middot; ${d.count} visit${d.count>1?'s':''}</div></div>`)
  .pointsMerge(false);

world.controls().enableDamping=true;
world.controls().autoRotate=true; world.controls().autoRotateSpeed=0.5;
world.pointOfView({lat:25,lng:-40,altitude:2.4},0);

// country polygons (loaded async; arcs work even if this fails)
let POLYS=[];
function paintPolys(activeMap){
  world.polygonCapColor(f=>activeMap[geoName(f)]||BASE_CAP)
       .polygonAltitude(f=>activeMap[geoName(f)]?0.016:0.006)
       .polygonStrokeColor(f=>activeMap[geoName(f)]?'#ffffff':BASE_STROKE)
       .polygonSideColor(()=>'rgba(90,209,255,0.05)');
}
fetch('https://vasturiano.github.io/globe.gl/example/datasets/ne_110m_admin_0_countries.geojson')
  .then(r=>r.json()).then(geo=>{
    POLYS=geo.features.filter(f=>(f.properties&&f.properties.ISO_A2)!=='AQ');
    world.polygonsData(POLYS).polygonCapColor(()=>BASE_CAP).polygonSideColor(()=>'rgba(90,209,255,0.05)')
         .polygonStrokeColor(()=>BASE_STROKE).polygonAltitude(0.006);
    if(mode==='flight') showFlight(idx,false);
  }).catch(e=>console.warn('country layer unavailable',e));

// ---- views ----
let mode='all', idx=0, playing=false, timer=null;

function cumStats(i){ // legs 0..i inclusive
  let c=new Set(),n=new Set();
  for(let k=0;k<=i;k++){[LEGS[k].d,LEGS[k].a].forEach(key=>{c.add(city(key));n.add(STAT_NORM[country(key)]||country(key));});}
  return {legs:i+1,cities:c.size,countries:n.size};
}
function setStats(legs,cities,countries){
  animateCount(document.getElementById('s-legs'),legs);
  animateCount(document.getElementById('s-cities'),cities);
  animateCount(document.getElementById('s-countries'),countries);
}

function showAll(){
  mode='all'; allBtn.classList.add('active');
  document.getElementById('route').textContent='All routes';
  document.getElementById('sub').innerHTML=ST.legs+' flights &middot; 1998&ndash;'+ST.maxYear;
  world.arcsData(DATA.arcs).pointsData(DATA.points);
  world.arcDashLength(0.5).arcDashGap(0.16).arcDashAnimateTime(2200);
  paintPolys({});
  world.controls().autoRotate=true;
  setStats(ST.legs,ST.cities,ST.countries);
}

function showFlight(i,recenter=true){
  mode='flight'; allBtn.classList.remove('active'); idx=i;
  const lg=LEGS[i], cs=C[lg.d], ce=C[lg.a];
  const arc={sLat:cs[0],sLng:cs[1],eLat:ce[0],eLng:ce[1],from:city(lg.d),to:city(lg.a),count:1,minY:lg.y,maxY:lg.y};
  world.arcsData([arc]);
  world.arcDashLength(0.55).arcDashGap(1.2).arcDashInitialGap(()=>0).arcDashAnimateTime(STEP_MS);
  world.pointsData([
    {name:city(lg.d),country:country(lg.d),lat:cs[0],lng:cs[1],count:1,role:'from'},
    {name:city(lg.a),country:country(lg.a),lat:ce[0],lng:ce[1],count:1,role:'to'}
  ]);
  // light up the two countries: departure cyan, arrival gold
  const am={};
  (COUNTRY_NORM[country(lg.d)]||[]).forEach(n=>am[n]='rgba(90,209,255,0.55)');
  (COUNTRY_NORM[country(lg.a)]||[]).forEach(n=>am[n]='rgba(255,194,77,0.6)'); // arrival wins on overlap
  paintPolys(am);
  // UI label
  document.getElementById('route').innerHTML=
    `<span class="from">${city(lg.d)}</span><span class="arrow">&rarr;</span><span class="to">${city(lg.a)}</span>`;
  document.getElementById('sub').textContent=lg.y+' · flight '+(i+1)+' / '+N;
  slider.value=i;
  const st=cumStats(i); setStats(st.legs,st.cities,st.countries);
  if(recenter){ const m=midpoint(cs[0],cs[1],ce[0],ce[1]);
    world.controls().autoRotate=false;
    world.pointOfView({lat:m.lat,lng:m.lng,altitude:2.25},800); }
}

// ---- controls ----
const slider=document.getElementById('slider');
slider.min=0; slider.max=N-1; slider.value=0;
const allBtn=document.getElementById('all'), playBtn=document.getElementById('play');
const playLbl=document.getElementById('play-lbl'), playIco=document.getElementById('play-ico');

slider.addEventListener('input',e=>{ stopPlay(); showFlight(+e.target.value); });
allBtn.addEventListener('click',()=>{ stopPlay(); showAll(); });

function stopPlay(){playing=false;clearInterval(timer);playLbl.textContent='Play';
  playIco.innerHTML='<path d="M8 5v14l11-7z"/>';}
function startPlay(){
  playing=true;playLbl.textContent='Pause';
  playIco.innerHTML='<path d="M6 5h4v14H6zM14 5h4v14h-4z"/>';
  let i = (mode==='flight' && idx<N-1) ? idx : 0;
  showFlight(i);
  timer=setInterval(()=>{
    i++;
    if(i>=N){ stopPlay(); setTimeout(showAll,700); return; }
    showFlight(i);
  },STEP_MS);
}
playBtn.addEventListener('click',()=>{ playing?stopPlay():startPlay(); });

const el=document.getElementById('globeViz');
['mousedown','touchstart','wheel'].forEach(ev=>el.addEventListener(ev,()=>{world.controls().autoRotate=false;}));

showAll();
function resize(){world.width(window.innerWidth).height(window.innerHeight);}
window.addEventListener('resize',resize); resize();
</script>
